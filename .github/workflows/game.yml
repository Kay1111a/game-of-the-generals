name: Playtest
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the arbiter and play 96 seeded matches
        run: node --test tests/game.test.cjs
      - name: Build offline game
        run: python tools/build.py
      - name: Install browser for interface tests
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Play local and solo matches in Chromium
        run: python tests/browser.py
      - name: Save the tested game and playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Salpakan-offline-and-playtests
          path: |
            dist/Salpakan.html
            test-results/
