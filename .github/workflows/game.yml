name: Playtest
on:
  push:
    branches: [snakes-and-ladders]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the offline document and install the test browser
        run: |
          python tools/build.py
          python -m pip install playwright==1.55.0
          python -m playwright install --only-shell chromium
      - name: Test rules, AI choices and visible game controls
        run: python tests/browser_qa.py
      - name: Keep viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SnakesAndLadders-layouts
          path: test-results/*.png
  windows-app:
    runs-on: windows-2025
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: NuGet/setup-nuget@v2
      - name: Build x64 game executable
        run: ./native/windows/build.ps1
      - name: Prepare Windows test runtime
        shell: pwsh
        run: |
          $installed = Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe", "$env:LOCALAPPDATA/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" -ErrorAction SilentlyContinue
          if (-not $installed) {
              $bootstrap = "$env:RUNNER_TEMP/MicrosoftEdgeWebview2Setup.exe"
              Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrap
              Start-Process $bootstrap -ArgumentList '/silent','/install' -Wait
          }
      - name: Play on the packaged EXE with its WebView offline
        run: python tests/native_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: SnakesAndLadders-Windows-x64
          path: dist/SnakesAndLadders.exe
          if-no-files-found: error

  android-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK and separate test APK
        run: |
          gradle -p native/android :app:assembleRelease :app:assembleReleaseAndroidTest --stacktrace
          cp native/android/app/build/outputs/apk/release/app-release.apk dist/SnakesAndLadders.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/SnakesAndLadders.apk
      - name: Allow the runner to use its emulator hardware accelerator
        run: |
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
      - name: Install and play the packaged APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -memory 2048
          script: bash tests/native_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SnakesAndLadders-Android
          path: dist/SnakesAndLadders.apk
          if-no-files-found: error

