plugins { id 'com.android.application' }

def projectRoot = rootProject.projectDir.parentFile.parentFile
def gameAssets = layout.buildDirectory.dir('generated/gameAssets')
def prepareGame = tasks.register('prepareGame', Exec) {
    inputs.files(new File(projectRoot, 'index.html'), new File(projectRoot, 'tools/build.py'))
    outputs.dir(gameAssets)
    workingDir projectRoot
    commandLine 'python', 'tools/build.py'
    doLast {
        copy { from new File(projectRoot, 'dist/SnakesAndLadders.html'); into gameAssets }
    }
}

android {
    namespace 'io.github.kay1111a.snakesladders'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.kay1111a.snakesladders'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    testBuildType 'release'
    sourceSets {
        main.assets.srcDir(gameAssets)
        androidTest.assets.srcDir(new File(projectRoot, 'tests/native'))
    }
}
tasks.named('preBuild').configure { dependsOn prepareGame }

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
